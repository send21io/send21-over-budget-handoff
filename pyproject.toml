[project]
name = "send21-over-budget-handoff"
version = "0.1.0"
description = "An agent with a hard spend cap hands off to a human with a send21 pay link instead of overspending."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "send21", email = "info@send21.io" }]
requires-python = ">=3.11"
dependencies = ["langgraph>=0.2", "mcp>=1.2", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["handoff", "adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]
